name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: flutter create --org com.example --project-name gasi_candle_ai --platforms android .

      - name: Write main.dart
        run: |
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          void main() => runApp(const MaterialApp(home: Home()));

          class Home extends StatefulWidget {
            const Home({super.key});
            @override
            State<Home> createState() => _HomeState();
          }

          class _HomeState extends State<Home> with WidgetsBindingObserver {
            static const _ch = MethodChannel('gasi/native');
            bool _granted = false;

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              _check();
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              super.dispose();
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState s) {
              if (s == AppLifecycleState.resumed) _check();
            }

            Future<void> _check() async {
              final r = await _ch.invokeMethod<bool>('hasOverlayPermission');
              if (mounted) setState(() => _granted = r ?? false);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('gasi candle analysis ai')),
                body: Center(
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Text(_granted ? 'Permission আছে' : 'Permission নেই'),
                      const SizedBox(height: 16),
                      if (!_granted)
                        FilledButton(
                          onPressed: () => _ch.invokeMethod('openOverlaySettings'),
                          child: const Text('Permission দিন'),
                        ),
                      if (_granted) ...[
                        FilledButton(
                          onPressed: () => _ch.invokeMethod('startOverlay'),
                          child: const Text('G button চালু করুন'),
                        ),
                        const SizedBox(height: 8),
                        OutlinedButton(
                          onPressed: () => _ch.invokeMethod('stopOverlay'),
                          child: const Text('বন্ধ করুন'),
                        ),
                      ],
                    ],
                  ),
                ),
              );
            }
          }
          EOF
          rm -rf test

      - name: Write AndroidManifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:label="gasi candle analysis ai"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="floating chart button" />
                  </service>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Write MainActivity
        run: |
          D=android/app/src/main/kotlin/com/example/gasi_candle_ai
          mkdir -p $D
          cat > $D/MainActivity.kt <<'EOF'
          package com.example.gasi_candle_ai

          import android.content.Intent
          import android.net.Uri
          import android.provider.Settings
          import androidx.core.content.ContextCompat
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      "gasi/native"
                  ).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "hasOverlayPermission" ->
                              result.success(Settings.canDrawOverlays(this))

                          "openOverlaySettings" -> {
                              startActivity(
                                  Intent(
                                      Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                      Uri.parse("package:" + packageName)
                                  )
                              )
                              result.success(null)
                          }

                          "startOverlay" -> {
                              if (!Settings.canDrawOverlays(this)) {
                                  result.error("NO_PERMISSION", "Overlay permission নেই", null)
                              } else {
                                  ContextCompat.startForegroundService(
                                      this, Intent(this, OverlayService::class.java)
                                  )
                                  result.success(null)
                              }
                          }

                          "stopOverlay" -> {
                              stopService(Intent(this, OverlayService::class.java))
                              result.success(null)
                          }

                          else -> result.notImplemented()
                      }
                  }
              }
          }
          EOF

      - name: Write OverlayService
        run: |
          D=android/app/src/main/kotlin/com/example/gasi_candle_ai
          cat > $D/OverlayService.kt <<'EOF'
          package com.example.gasi_candle_ai

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.widget.TextView
          import android.widget.Toast
          import kotlin.math.abs

          class OverlayService : Service() {

              private lateinit var wm: WindowManager
              private var button: TextView? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  startAsForeground()
                  showButton()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int =
                  START_NOT_STICKY

              private fun startAsForeground() {
                  val channelId = "gasi_overlay"
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel(channelId, "Floating G", NotificationManager.IMPORTANCE_LOW)
                  )
                  val n = Notification.Builder(this, channelId)
                      .setSmallIcon(android.R.drawable.ic_menu_camera)
                      .setContentTitle("gasi candle analysis ai")
                      .setContentText("Floating G চালু আছে")
                      .setOngoing(true)
                      .build()

                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1001, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(1001, n)
                  }
              }

              private fun showButton() {
                  if (button != null) return
                  val size = (58 * resources.displayMetrics.density).toInt()

                  val bg = GradientDrawable()
                  bg.shape = GradientDrawable.OVAL
                  bg.setColor(Color.rgb(139, 92, 246))

                  val tv = TextView(this)
                  tv.text = "G"
                  tv.textSize = 22f
                  tv.setTextColor(Color.WHITE)
                  tv.gravity = Gravity.CENTER
                  tv.background = bg

                  val lp = WindowManager.LayoutParams(
                      size, size,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = 30
                  lp.y = 300

                  var startX = 0
                  var startY = 0
                  var touchX = 0f
                  var touchY = 0f

                  tv.setOnTouchListener { v, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = lp.x
                              startY = lp.y
                              touchX = e.rawX
                              touchY = e.rawY
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              lp.x = startX + (e.rawX - touchX).toInt()
                              lp.y = startY + (e.rawY - touchY).toInt()
                              wm.updateViewLayout(v, lp)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (abs(e.rawX - touchX) < 15 && abs(e.rawY - touchY) < 15) {
                                  Toast.makeText(this, "G চাপা হয়েছে", Toast.LENGTH_SHORT).show()
                              }
                              true
                          }
                          else -> false
                      }
                  }

                  wm.addView(tv, lp)
                  button = tv
              }

              override fun onDestroy() {
                  button?.let {
                      try {
                          wm.removeView(it)
                      } catch (_: Exception) {
                      }
                  }
                  button = null
                  super.onDestroy()
              }
          }
          EOF

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: gasi-candle-analysis-ai
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
