name: Build Gasi Candle Analysis AI APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify source files from ZIP
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            home_screen.dart main.dart result_card.dart result_gauge.dart setup_card.dart
            MainActivity.kt OverlayService.kt AnalysisPrompt.kt KeySound.kt
            AndroidManifest.xml file_paths.xml logo.png earth_globe.png earth_hero.png
          )
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required source file is missing from repository root: $file"
              exit 1
            fi
          done
          echo 'Source-file check passed.'

      - name: Generate Android scaffold if missing
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d android ]]; then
            flutter create \
              --platforms=android \
              --org=com.example \
              --project-name=gasi_candle_ai \
              .
          fi
          test -d android/app || {
            echo '::error::Android scaffold was not generated'
            exit 1
          }

      - name: Prepare Dart sources and assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lib assets
          rm -rf test

          # Use home_screen.dart as the app entry point.
          # Do not concatenate the mixed root main.dart.
          cp home_screen.dart lib/main.dart
          cp result_card.dart lib/result_card.dart
          cp result_gauge.dart lib/result_gauge.dart
          cp setup_card.dart lib/setup_card.dart

          # Create the missing AppColors dependency.
          cat > lib/app_colors.dart <<'DART'
          import 'package:flutter/material.dart';

          class AppColors {
            static const purple = Color(0xFF8B5CF6);
            static const lilac = Color(0xFFC084FC);
            static const green = Color(0xFF38D996);
            static const red = Color(0xFFFF6685);
            static const amber = Color(0xFFFFB45C);
          }
          DART

          cp logo.png assets/logo.png
          cp earth_globe.png assets/earth_globe.png
          cp earth_hero.png assets/earth_hero.png

      - name: Write a clean, valid pubspec.yaml
        shell: bash
        run: |
          set -euo pipefail

          cat > pubspec.yaml <<'PUBSPEC'
          name: gasi_candle_ai
          description: Gasi Candle Analysis AI
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0

          flutter:
            uses-material-design: true
            assets:
              - assets/logo.png
              - assets/earth_globe.png
              - assets/earth_hero.png
          PUBSPEC

          cat pubspec.yaml
          flutter pub get

      - name: Install Android native sources and manifest
        shell: bash
        run: |
          set -euo pipefail

          native_dir='android/app/src/main/kotlin/com/example/gasi_candle_ai'
          mkdir -p "$native_dir" android/app/src/main/res/xml

          cp MainActivity.kt "$native_dir/MainActivity.kt"
          cp OverlayService.kt "$native_dir/OverlayService.kt"
          cp AnalysisPrompt.kt "$native_dir/AnalysisPrompt.kt"
          cp KeySound.kt "$native_dir/KeySound.kt"
          cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp file_paths.xml android/app/src/main/res/xml/file_paths.xml

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/app/build.gradle.kts')
          text = p.read_text()

          replacements = [
              (
                  r'(?m)^(\s*namespace\s*=\s*)["\'][^"\']+["\']',
                  r'\1"com.example.gasi_candle_ai"',
              ),
              (
                  r'(?m)^(\s*applicationId\s*=\s*)["\'][^"\']+["\']',
                  r'\1"com.example.gasi_candle_ai"',
              ),
              (
                  r'(?m)^(\s*minSdk\s*=\s*).+$',
                  r'\g<1>26',
              ),
          ]

          for pattern, replacement in replacements:
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(
                      f'Could not safely update Gradle setting: {pattern}'
                  )

          p.write_text(text)
          print('Android Gradle settings configured.')
          PY

      - name: Validate Dart source
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: gasi-candle-analysis-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
