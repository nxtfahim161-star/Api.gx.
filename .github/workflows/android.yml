name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: flutter create --org com.example --project-name gasi_candle_ai --platforms android .

      - name: Merge Dart files
        run: |
          {
            printf "import 'dart:convert';\n"
            printf "import 'package:flutter/material.dart';\n"
            printf "import 'package:flutter/services.dart';\n\n"
            for f in main.dart result_card.dart home_screen.dart; do
              if [ -f "$f" ]; then
                sed -E "s/\}import /}\nimport /g" "$f" | grep -v "^import "
                echo
              fi
            done
          } > lib/main.dart
          rm -f ./*.dart
          rm -rf test

      - name: Place Android files
        run: |
          D=android/app/src/main/kotlin/com/example/gasi_candle_ai
          mkdir -p $D android/app/src/main/res/xml
          sed -E "s/\}package /}\npackage /g" OverlayService.kt > /tmp/os.kt
          if [ "$(grep -c '^package ' /tmp/os.kt)" -ge 2 ]; then
            awk -v d="$D" '/^package /{n++} n==1{print > (d "/Prompt.kt")} n>=2{print > (d "/OverlayService.kt")}' /tmp/os.kt
          else
            cp /tmp/os.kt $D/OverlayService.kt
            if [ -f Prompt.kt ]; then cp Prompt.kt $D/Prompt.kt; fi
          fi
          cp MainActivity.kt $D/MainActivity.kt
          cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp file_paths.xml android/app/src/main/res/xml/file_paths.xml

      - name: Android build fixes
        run: |
          D=android/app/src/main/kotlin/com/example/gasi_candle_ai
          sed -i 's/val p = mpm.getMediaProjection(code, data)/val p = mpm.getMediaProjection(code, data) ?: throw IllegalStateException("MediaProjection null")/' $D/OverlayService.kt
          grep -n "getMediaProjection" $D/OverlayService.kt || true
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts
            printf '\nandroid {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n}\n' >> android/app/build.gradle.kts
          fi

      - name: Add logo
        run: |
          if [ -f logo.png ]; then
            mkdir -p assets
            cp logo.png assets/logo.png
            flutter pub add dev:flutter_launcher_icons
            printf '\nflutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "assets/logo.png"\n' >> pubspec.yaml
            sed -i 's/^flutter:$/flutter:\n  assets:\n    - assets\/logo.png/' pubspec.yaml
            dart run flutter_launcher_icons
          fi

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: gasi-candle-analysis-ai
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
