name: Build Gasi Candle Analysis AI APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify source files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            home_screen.dart
            MainActivity.kt
            OverlayService.kt
            AnalysisPrompt.kt
            KeySound.kt
            AndroidManifest.xml
            file_paths.xml
            logo.png
            earth_globe.png
            earth_hero.png
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required source file is missing: $file"
              exit 1
            fi
          done

          echo "All required source files found."

      - name: Generate Flutter Android scaffold
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f android/gradlew || ! -f android/app/build.gradle.kts ]]; then
            flutter create \
              --platforms=android \
              --org=com.example \
              --project-name=gasi_candle_ai \
              .
          fi

          test -f android/gradlew
          test -f android/app/build.gradle.kts

      - name: Prepare Flutter app and assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p lib assets

          # Use the existing home screen as the real app entry point.
          # Do not merge the separate, conflicting Dart implementations.
          cp home_screen.dart lib/main.dart

          cat > lib/app_colors.dart <<'DART'
          import 'package:flutter/material.dart';

          class AppColors {
            static const Color purple = Color(0xFF8B5CF6);
            static const Color lilac = Color(0xFFC084FC);
            static const Color green = Color(0xFF38D996);
            static const Color red = Color(0xFFFF6685);
            static const Color amber = Color(0xFFFFB45C);
          }
          DART

          cp logo.png assets/logo.png
          cp earth_globe.png assets/earth_globe.png
          cp earth_hero.png assets/earth_hero.png

      - name: Write a clean pubspec.yaml
        shell: bash
        run: |
          set -euo pipefail

          cat > pubspec.yaml <<'PUBSPEC'
          name: gasi_candle_ai
          description: Gasi Candle Analysis AI
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0

          flutter:
            uses-material-design: true
            assets:
              - assets/logo.png
              - assets/earth_globe.png
              - assets/earth_hero.png
          PUBSPEC

          flutter pub get

      - name: Install Android native files
        shell: bash
        run: |
          set -euo pipefail

          native_dir='android/app/src/main/kotlin/com/example/gasi_candle_ai'

          mkdir -p "$native_dir"
          mkdir -p android/app/src/main/res/xml

          cp MainActivity.kt "$native_dir/MainActivity.kt"
          cp OverlayService.kt "$native_dir/OverlayService.kt"
          cp AnalysisPrompt.kt "$native_dir/AnalysisPrompt.kt"
          cp KeySound.kt "$native_dir/KeySound.kt"

          cp AndroidManifest.xml \
            android/app/src/main/AndroidManifest.xml

          cp file_paths.xml \
            android/app/src/main/res/xml/file_paths.xml

          # Register the optional native typing sound channel.
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/src/main/kotlin/"
              "com/example/gasi_candle_ai/MainActivity.kt"
          )

          s = p.read_text()

          if "KeySound.register(flutterEngine)" not in s:
              marker = (
                  "        super.configureFlutterEngine(flutterEngine)\n"
              )

              if marker not in s:
                  raise SystemExit(
                      "Could not find configureFlutterEngine insertion point"
                  )

              s = s.replace(
                  marker,
                  marker + "        KeySound.register(flutterEngine)\n",
                  1,
              )

              p.write_text(s)

          print("Native sound-channel registration checked.")
          PY

          # Keep the Gradle application identity aligned with Kotlin packages.
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          rules = [
              (
                  r'(?m)^(\s*namespace\s*=\s*)["\'][^"\']+["\']',
                  r'\1"com.example.gasi_candle_ai"',
              ),
              (
                  r'(?m)^(\s*applicationId\s*=\s*)["\'][^"\']+["\']',
                  r'\1"com.example.gasi_candle_ai"',
              ),
              (
                  r'(?m)^(\s*minSdk\s*=\s*).+$',
                  r'\g<1>26',
              ),
          ]

          for pattern, replacement in rules:
              s, count = re.subn(
                  pattern,
                  replacement,
                  s,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      f"Unable to configure Gradle setting: {pattern}"
                  )

          p.write_text(s)

          print("Gradle namespace, application ID and minSdk configured.")
          PY

      - name: Validate and analyze Flutter project
        shell: bash
        run: |
          set -euo pipefail

          flutter pub get

          flutter analyze \
            --no-pub \
            --no-fatal-infos \
            --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Gasi-Candle-Analysis-AI-release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
