
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check source files
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository root: $GITHUB_WORKSPACE"
          echo "Available files:"
          find . -maxdepth 3 -type f \
            \( -name '*.kt' -o -name '*.dart' \
            -o -name 'pubspec.yaml' \) | sort

          for f in \
            MainActivity.kt \
            OverlayService.kt \
            AndroidManifest.xml \
            file_paths.xml \
            KeySound.kt \
            CompactCard.kt \
            AnalysisPrompt.kt \
            AnimButton.kt
          do
            if [ ! -f "$f" ]; then
              echo "::error::Required source file missing: $f"
              exit 1
            fi
          done

      - name: Create Android project
        run: |
          flutter create \
            --org com.example \
            --project-name gasi_candle_ai \
            --platforms android .

      - name: Merge Dart source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lib

          {
            printf "import 'dart:convert';\n"
            printf "import 'package:flutter/material.dart';\n"
            printf "import 'package:flutter/services.dart';\n\n"

            for f in main.dart result_card.dart home_screen.dart; do
              if [ -f "$f" ]; then
                sed -E 's/}import /}\nimport /g' "$f" |
                  grep -v '^import ' || true
                echo
              fi
            done
          } > lib/main.dart

          test -s lib/main.dart || {
            echo "::error::lib/main.dart is empty"
            exit 1
          }

          rm -f ./*.dart
          rm -rf test

      - name: Install Android source files
        shell: bash
        run: |
          set -euo pipefail

          D="android/app/src/main/kotlin/com/example/gasi_candle_ai"
          mkdir -p "$D" android/app/src/main/res/xml

          cp MainActivity.kt "$D/MainActivity.kt"
          cp AndroidManifest.xml \
            android/app/src/main/AndroidManifest.xml
          cp file_paths.xml \
            android/app/src/main/res/xml/file_paths.xml

          cp KeySound.kt "$D/KeySound.kt"
          cp CompactCard.kt "$D/CompactCard.kt"
          cp AnalysisPrompt.kt "$D/AnalysisPrompt.kt"
          cp AnimButton.kt "$D/AnimButton.kt"

          sed -E 's/}package /}\npackage /g' \
            OverlayService.kt > /tmp/OverlayService.kt

          if [ "$(grep -c '^package ' /tmp/OverlayService.kt)" -ge 2 ]; then
            awk -v d="$D" '
              /^package / { n++ }
              n == 1 { print > (d "/Prompt.kt"); next }
              n >= 2 { print > (d "/OverlayService.kt") }
            ' /tmp/OverlayService.kt
          else
            cp /tmp/OverlayService.kt "$D/OverlayService.kt"
          fi

      - name: Configure Android build
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="android/app/build.gradle.kts"

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "::error::Missing $GRADLE_FILE"
            exit 1
          fi

          sed -i \
            's/minSdk = flutter.minSdkVersion/minSdk = 26/' \
            "$GRADLE_FILE"

          echo "Android build configuration checked."

      - name: Add API keys
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TD_KEY: ${{ secrets.TD_KEY }}
        run: |
          mkdir -p android/app/src/main/assets
          printf '%s\n%s\n' \
            "$GEMINI_KEY" "$TD_KEY" \
            > android/app/src/main/assets/keys.txt

      - name: Add logo and images
        shell: bash
        run: |
          mkdir -p assets

          if [ -f logo.png ]; then
            cp logo.png assets/logo.png
          fi

          for f in earth_hero.png earth_globe.png; do
            if [ -f "images/$f" ]; then
              cp "images/$f" "assets/$f"
            elif [ -f "$f" ]; then
              cp "$f" "assets/$f"
            fi
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gasi-candle-analysis-ai
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
