name: Build Gasi Candle Analysis AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: gasi-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify actual project source files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            home_screen.dart
            MainActivity.kt
            OverlayService.kt
            KeySound.kt
            AndroidManifest.xml
            file_paths.xml
            logo.png
            earth_globe.png
            earth_hero.png
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file missing: $file"
              exit 1
            fi
          done

          echo "All required source files are present."

      - name: Generate Android project scaffold
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f android/gradlew ]] || \
             [[ ! -f android/app/build.gradle.kts ]]; then
            flutter create \
              --platforms=android \
              --org=com.example \
              --project-name=gasi_candle_ai \
              .
          fi

          if [[ ! -f android/gradlew ]] || \
             [[ ! -f android/app/build.gradle.kts ]]; then
            echo "::error::Android Gradle scaffold is incomplete."
            exit 1
          fi

      - name: Prepare Flutter source and assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p lib assets

          # The existing home screen contains the main app UI.
          # Do not merge the separate root main.dart into it.
          cp home_screen.dart lib/main.dart

          cat > lib/app_colors.dart <<'DART'
          import 'package:flutter/material.dart';

          class AppColors {
            static const purple = Color(0xFF8B5CF6);
            static const lilac = Color(0xFFC084FC);
            static const green = Color(0xFF38D996);
            static const red = Color(0xFFFF6685);
            static const amber = Color(0xFFFFB45C);
          }
          DART

          cp logo.png assets/logo.png
          cp earth_globe.png assets/earth_globe.png
          cp earth_hero.png assets/earth_hero.png

      - name: Create valid Flutter pubspec
        shell: bash
        run: |
          set -euo pipefail

          cat > pubspec.yaml <<'PUBSPEC'
          name: gasi_candle_ai
          description: Gasi Candle Analysis AI
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0

          flutter:
            uses-material-design: true
            assets:
              - assets/logo.png
              - assets/earth_globe.png
              - assets/earth_hero.png
          PUBSPEC

          flutter pub get

      - name: Install native Android source files
        shell: bash
        run: |
          set -euo pipefail

          NATIVE_DIR="android/app/src/main/kotlin/com/example/gasi_candle_ai"

          mkdir -p "$NATIVE_DIR"
          mkdir -p android/app/src/main/res/xml

          cp MainActivity.kt "$NATIVE_DIR/MainActivity.kt"
          cp OverlayService.kt "$NATIVE_DIR/OverlayService.kt"
          cp KeySound.kt "$NATIVE_DIR/KeySound.kt"

          cp AndroidManifest.xml \
            android/app/src/main/AndroidManifest.xml

          cp file_paths.xml \
            android/app/src/main/res/xml/file_paths.xml

          # AnalysisPrompt (v3) is declared inside OverlayService.kt.

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/src/main/kotlin/"
              "com/example/gasi_candle_ai/MainActivity.kt"
          )

          source = path.read_text()

          registration = "        KeySound.register(flutterEngine)"

          if registration not in source:
              marker = (
                  "        super.configureFlutterEngine(flutterEngine)\n"
              )

              if marker not in source:
                  raise SystemExit(
                      "Cannot safely register KeySound: "
                      "configureFlutterEngine marker not found."
                  )

              source = source.replace(
                  marker,
                  marker + registration + "\n",
                  1,
              )

              path.write_text(source)

          print("KeySound channel registration verified.")
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          source = path.read_text()

          settings = [
              (
                  r'(?m)^(\s*namespace\s*=\s*)["\'][^"\']+["\']',
                  r'\1"com.example.gasi_candle_ai"',
              ),
              (
                  r'(?m)^(\s*applicationId\s*=\s*)["\'][^"\']+["\']',
                  r'\1"com.example.gasi_candle_ai"',
              ),
          ]

          for pattern, replacement in settings:
              source, count = re.subn(
                  pattern,
                  replacement,
                  source,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      "Unable to configure Android application identity: "
                      + pattern
                  )

          path.write_text(source)
          print("Android namespace and application ID verified.")
          PY

      - name: Validate Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      - name: Analyze Dart source
        shell: bash
        run: |
          set -euo pipefail

          flutter analyze lib \
            --no-pub \
            --no-fatal-infos \
            --no-fatal-warnings

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::Release APK was not created."
            exit 1
          fi

          echo "Release APK created successfully."
          ls -lh "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Gasi-Candle-Analysis-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
