name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: flutter create --org com.example --project-name gasi_candle_ai --platforms android .

      - name: Place Dart files
        run: |
          mv -f main.dart lib/main.dart
          mv -f app_colors.dart ai_result.dart result_card.dart info_cards.dart action_cards.dart lib/
          rm -rf test

      - name: Place Android files
        run: |
          D=android/app/src/main/kotlin/com/example/gasi_candle_ai
          mkdir -p $D android/app/src/main/res/xml
          mv -f MainActivity.kt OverlayService.kt Prompt.kt $D/
          mv -f AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mv -f file_paths.xml android/app/src/main/res/xml/file_paths.xml

      - name: Add logo
        run: |
          if [ -f logo.png ]; then
            mkdir -p assets
            cp logo.png assets/logo.png
            flutter pub add dev:flutter_launcher_icons
            printf '\nflutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "assets/logo.png"\n' >> pubspec.yaml
            sed -i 's/^flutter:$/flutter:\n  assets:\n    - assets\/logo.png/' pubspec.yaml
            dart run flutter_launcher_icons
          fi

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: gasi-candle-analysis-ai
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
