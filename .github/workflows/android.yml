name: Build Gasi Candle Analysis AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Inspect supplied source files
        shell: bash
        run: |
          set -euo pipefail
          echo "Flutter: $(flutter --version | head -n 1)"
          echo "Java: $(java -version 2>&1 | head -n 1)"
          echo "Repository source files:"
          find . -maxdepth 3 -type f \( -name '*.dart' -o -name '*.kt' -o -name '*.xml' -o -name 'pubspec.yaml' \) -print | sort

          for file in home_screen.dart main.dart result_card.dart result_gauge.dart setup_card.dart MainActivity.kt OverlayService.kt AnalysisPrompt.kt KeySound.kt AndroidManifest.xml file_paths.xml; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required source file is missing: $file"
              exit 1
            fi
          done

      - name: Create Flutter Android project scaffold
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f pubspec.yaml || ! -d android ]]; then
            flutter create \
              --platforms=android \
              --org=com.example \
              --project-name=gasi_candle_ai \
              .
          fi

      - name: Prepare Dart source layout and assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lib assets

          # Keep each provided Dart file separate; do not concatenate libraries.
          cp home_screen.dart lib/home_screen.dart
          cp result_card.dart lib/result_card.dart
          cp result_gauge.dart lib/result_gauge.dart
          cp setup_card.dart lib/setup_card.dart

          # The root main.dart is a mixed source file with imports in the middle.
          # Keep it out of lib; it must be refactored as a separate source task.

          # The supplied home_screen.dart contains the app's main() entry point.
          cp home_screen.dart lib/main.dart

          # Preserve provided image files and put them at the asset paths used
          # by the Dart source.
          [[ ! -f logo.png ]] || cp logo.png assets/logo.png
          [[ ! -f earth_globe.png ]] || cp earth_globe.png assets/earth_globe.png
          [[ ! -f earth_hero.png ]] || cp earth_hero.png assets/earth_hero.png

          echo 'Prepared Dart files:'
          find lib -maxdepth 1 -type f -name '*.dart' -print | sort

      - name: Configure Flutter dependencies and assets
        shell: bash
        run: |
          set -euo pipefail
          # Add asset paths under the existing flutter: section without
          # duplicating that top-level key in the generated pubspec.yaml.
          python3 - <<'PYEDIT'
          from pathlib import Path
          p = Path('pubspec.yaml')
          text = p.read_text()
          if '\nflutter:\n' not in text and not text.startswith('flutter:\n'):
              raise SystemExit('pubspec.yaml has no flutter: section')
          assets = ['assets/logo.png', 'assets/earth_globe.png', 'assets/earth_hero.png']
          if not any(line.strip() == 'assets:' for line in text.splitlines()):
              lines = text.splitlines()
              idx = next(i for i, line in enumerate(lines) if line.strip() == 'flutter:')
              lines[idx + 1:idx + 1] = ['  assets:', *[f'    - {asset}' for asset in assets]]
              text = '\n'.join(lines) + '\n'
          p.write_text(text)
          PYEDIT
          flutter pub get

      - name: Install Android native source files
        shell: bash
        run: |
          set -euo pipefail
          NATIVE_DIR='android/app/src/main/kotlin/com/example/gasi_candle_ai'
          mkdir -p "$NATIVE_DIR" android/app/src/main/res/xml

          cp MainActivity.kt "$NATIVE_DIR/MainActivity.kt"
          cp OverlayService.kt "$NATIVE_DIR/OverlayService.kt"
          cp AnalysisPrompt.kt "$NATIVE_DIR/AnalysisPrompt.kt"
          cp KeySound.kt "$NATIVE_DIR/KeySound.kt"
          cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp file_paths.xml android/app/src/main/res/xml/file_paths.xml

          # Match the namespace used by the provided Kotlin files.
          if [[ -f android/app/build.gradle.kts ]]; then
            sed -i 's/^\([[:space:]]*namespace[[:space:]]*=\).*/\1 "com.example.gasi_candle_ai"/' android/app/build.gradle.kts
            sed -i 's/^\([[:space:]]*applicationId[[:space:]]*=\).*/\1 "com.example.gasi_candle_ai"/' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts
          else
            echo '::error::Flutter scaffold did not create android/app/build.gradle.kts'
            exit 1
          fi

      - name: Validate Dart code
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-pub

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: gasi-candle-analysis-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
          
